checks:["Which single technique has the most problems in your review queue, and what does that tell you about where your intuition is weakest?","Take one concept you re-derived today: could you teach it to a colleague in 5 minutes without notes? If not, what specific part breaks down?"]},

{ id:27, week:4, title:"Timed Mock Interviews", topics:"Interview simulation · Communication protocol",
lesson:`
<h3>Today you rehearse the performance, not just the algorithm</h3>
<p>SDE-2 interviews grade problem-solving AND communication. Today: 3 mock sets, 2 problems each, <b>35 minutes per problem, strict timer</b> (use the timer in the top bar). Follow this protocol exactly:</p>
<ol>
<li><b>Minutes 0–5 — Clarify.</b> Restate the problem. Ask about edge cases, input ranges, duplicates, empty inputs. State the constraint-driven target complexity ("n up to 10⁵, so I need O(n log n) or better").</li>
<li><b>Minutes 5–10 — Approach.</b> Present brute force FIRST, then the optimization path: "brute force is O(n²) because…; the wasted work is…; if we exploit X we get…". Get explicit buy-in before coding — real interviewers expect this.</li>
<li><b>Minutes 10–25 — Code.</b> Narrate as you write. Clean names. State the invariant as a comment where relevant.</li>
<li><b>Minutes 25–35 — Test &amp; analyze.</b> Dry-run on an example OUT LOUD, including an edge case. State final time/space complexity. Mention what you'd do with more time (follow-up variants).</li>
</ol>
<div class="callout warn"><b>Grade yourself harshly:</b> did you clarify before coding? Did you state brute force first? Did you go silent for 5+ minutes? Would an interviewer at a top company pass you? Record problems in the Practice tab below with honest status — anything not "independent" goes to the review queue.</div>`,
guided:{title:"The STAR-style post-mortem (do this after every mock)",
intuition:`After each problem, write three lines: what went well, where you lost time, and the ONE process change for the next problem. Patterns in post-mortems are more valuable than patterns in algorithms at this stage.`,
code:`// Post-mortem template:
// Went well:      ______________________
// Lost time on:   ______________________
// Process change: ______________________
// Verdict: PASS / BORDERLINE / FAIL (be honest)`,
complexity:"3 mocks × ~75 min ≈ 4 hours. If that exceeds your daily budget, do 2 mocks and carry the third to Day 28 morning."},
practice:[
{t:"Mock A-1: Longest Substring Without Repeating Characters",s:"longest-substring-without-repeating-characters",d:M},
{t:"Mock A-2: Number of Islands",s:"number-of-islands",d:M},
{t:"Mock B-1: Course Schedule II",s:"course-schedule-ii",d:M},
{t:"Mock B-2: K Closest Points to Origin",s:"k-closest-points-to-origin",d:M},
{t:"Mock C-1: Coin Change",s:"coin-change",d:M},
{t:"Mock C-2: Daily Temperatures",s:"daily-temperatures",d:M}],

{ id:28, week:4, title:"Final Review & Selected Hard Problems", topics:"Consolidation · Capstone hard problems",
lesson:`
<h3>Congratulations — Day 28</h3>
<p>Final day structure:</p>
<ol>
<li><b>45 min — Concept sweep.</b> For each of the 24 techniques from Days 1–24, say out loud in one sentence: the underlying problem it solves, its invariant, and its complexity. Anything you can't produce fluently goes on a final flashcard list.</li>
<li><b>90 min — Capstone hard problems</b> (Practice tab). These combine multiple techniques each — exactly what hard interviews do.</li>
<li><b>30 min — Review queue cleanup.</b> Clear every due review. Anything still marked "still hard" — schedule it consciously into your ongoing routine; don't let it silently die.</li>
</ol>
<div class="callout"><b>Beyond Day 28:</b> your roadmap targets interview-readiness with advanced practice and mocks continuing to Dec 14. Maintain the rhythm: 2–3 due reviews daily, one timed mock every 2–3 days, and one NEW medium problem daily to keep pattern recognition sharp. The Review view keeps working for you — every problem you've marked flows through the 1/3/7-day cycle automatically.</div>
<h3>How hard problems combine techniques</h3>
<p>Median of Two Sorted Arrays: binary search on the partition, not on values. Word Search II: trie + grid DFS + backtracking + pruning. Burst Balloons: interval DP with the "last operation" insight. Largest Rectangle: monotonic stack + sentinel. Find Median from Data Stream: two heaps + rebalancing invariant. Notice: none of these require a NEW base technique — they require <b>composing two you already own</b>. That composition is what SDE-2 interviews actually test.</p>`,
guided:{title:"Capstone strategy",
intuition:`For each hard problem: spend up to 20 minutes on identification. Ask "which TWO techniques from my toolkit could compose here?" — hard problems are almost always a composition. If identification fails after 20 focused minutes, study the editorial actively: predict the next step before reading it, then re-implement from scratch tomorrow (it'll auto-enter your review queue).`,
code:`// Capstone protocol:
// 1. 20 min: identify composition of techniques
// 2. Solve, or study editorial ACTIVELY (predict-then-verify)
// 3. Re-implement from scratch within 24h
// 4. Mark honestly - the review system does the rest`,
complexity:"Time-box strictly: 90 minutes for capstones, hard 30-minute cap per problem for identification."},
practice:[
{t:"Median of Two Sorted Arrays",s:"median-of-two-sorted-arrays",d:H},
{t:"Largest Rectangle in Histogram",s:"largest-rectangle-in-histogram",d:H},
{t:"Word Search II",s:"word-search-ii",d:H},
{t:"Burst Balloons",s:"burst-balloons",d:H},
{t:"Find Median from Data Stream",s:"find-median-from-data-stream",d:H}],
checks:["Final self-assessment: name your three strongest techniques and three weakest. What is your concrete maintenance plan for the weakest three over the next two weeks?","Explain to an imaginary interviewer why 'composition of two known techniques' is the correct mental model for hard problems, using one of today's capstones as the example."]}
];

/* ============================= STATE ============================= */
const STORE_KEY = "dsa-sde2-progress-v1";
let state = load();
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || fresh(); }
  catch (e) { return fresh(); }
  function fresh() { return { daysDone: {}, problems: {}, currentDay: 1 }; }
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function todayStr() { // IST date
  return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Calcutta" });
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.toLocaleDateString("en-CA");
}
const STATUS_LABEL = { independent: "Solved independently", hints: "Solved with hints", solution: "Needed solution", revision: "Needs revision" };

function setStatus(day, prob, status) {
  const key = prob.s;
  const prev = state.problems[key];
  const t = todayStr();
  if (!prev || prev.status !== status || status !== "independent") {
    state.problems[key] = { status: status, day: day, date: t,
      title: prob.t, url: LC(prob.s), diff: prob.d,
      reviews: (status === "independent") ? [] : [1,3,7].map(n => ({ due: addDays(t, n), done: false })) };
  } else {
    state.problems[key].status = status;
  }
  save(); render();
}
function dueReviews() {
  const t = todayStr(), out = [];
  for (const key of Object.keys(state.problems)) {
    const p = state.problems[key];
    for (const r of (p.reviews || [])) {
      if (!r.done && r.due <= t) { out.push({ key, p, r }); break; }
    }
  }
  return out;
}
function pendingReviews() {
  let n = 0;
  for (const key of Object.keys(state.problems)) {
    for (const r of (state.problems[key].reviews || [])) if (!r.done && r.due <= todayStr()) { n++; break; }
  }
  return n;
}
function reviewDone(key) {
  const p = state.problems[key];
  for (const r of p.reviews) if (!r.done && r.due <= todayStr()) { r.done = true; break; }
  save(); render();
}
function reviewRevisit(key) {
  const p = state.problems[key], t = todayStr();
  p.reviews = [1,3,7].map(n => ({ due: addDays(t, n), done: false }));
  save(); render();
}

/* ============================= TIMER ============================= */
let timerSec = 45*60, timerRun = false, timerId = null;
function fmt(s){ return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }
function tick() {
  if (timerSec > 0) timerSec--;
  document.getElementById("timer-display").textContent = fmt(timerSec);
  if (timerSec === 0) { stopTimer(); }
}
function stopTimer(){ timerRun=false; clearInterval(timerId); document.getElementById("timer-toggle").textContent="Start"; }
document.getElementById("timer-toggle").onclick = () => {
  if (timerRun) { stopTimer(); }
  else { timerRun=true; timerId=setInterval(tick,1000); document.getElementById("timer-toggle").textContent="Pause"; }
};
document.getElementById("timer-reset").onclick = () => {
  stopTimer();
  const active = document.querySelector(".tpreset.active");
  timerSec = parseInt(active.dataset.min)*60;
  document.getElementById("timer-display").textContent = fmt(timerSec);
};
document.querySelectorAll(".tpreset").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tpreset").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  stopTimer(); timerSec = parseInt(b.dataset.min)*60;
  document.getElementById("timer-display").textContent = fmt(timerSec);
});

/* ============================= RENDER ============================= */
let view = { type: "day", id: 1 };
let activeTab = "lesson";

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderNav() {
  const nav = document.getElementById("nav");
  let html = '<div class="nav-item ' + (view.type==="home"?"active":"") + '" onclick="go(\'home\')">🏠 Dashboard ' + (pendingReviews()?'<span class="badge" style="background:var(--warn);color:#201200;border-radius:10px;font-size:10px;padding:1px 6px">'+pendingReviews()+'</span>':"") + '</div>';
  html += '<div class="nav-item ' + (view.type==="review"?"active":"") + '" onclick="go(\'review\')">🔁 Review Queue <span class="badge" style="background:'+(pendingReviews()?"var(--warn)":"var(--panel2)")+';color:'+(pendingReviews()?"#201200":"var(--muted)")+';border-radius:10px;font-size:10px;padding:1px 6px">'+pendingReviews()+'</span></div>';
  let w = 0;
  for (const d of DAYS) {
    if (d.week !== w) { w = d.week; html += '<div class="week-label">Week ' + w + '</div>'; }
    html += '<div class="nav-item ' + (view.type==="day"&&view.id===d.id?"active":"") + ' ' + (state.daysDone[d.id]?"done":"") + '" onclick="go(\'day\',' + d.id + ')"><span class="num">' + (state.daysDone[d.id]?"✓":d.id) + '</span><span>' + d.title.split("—")[0].trim() + '</span></div>';
  }
  nav.innerHTML = html;
}

function render() {
  renderNav();
  const tb = document.getElementById("tb-title"), sub = document.getElementById("tb-sub"), c = document.getElementById("content");
  if (view.type === "home") {
    tb.textContent = "Dashboard"; sub.textContent = "SDE-2 DSA Preparation · 28-day roadmap";
    c.innerHTML = renderHome();
  } else if (view.type === "review") {
    tb.textContent = "Spaced Repetition — Review Queue"; sub.textContent = "Difficult problems resurface at +1, +3, +7 days";
    c.innerHTML = renderReview();
  } else {
    const d = DAYS.find(x => x.id === view.id);
    tb.textContent = "Day " + d.id + " — " + d.title; sub.textContent = d.topics;
    c.innerHTML = renderDay(d);
  }
  const el = document.getElementById("guided-code");
  if (el && view.type === "day") {
    const d = DAYS.find(x => x.id === view.id);
    if (d && d.guided) el.textContent = d.guided.code;
  }
}
function go(type, id) {
  view = { type: type, id: id }; activeTab = "lesson";
  document.querySelector(".main").scrollTop = 0;
  render();
}
window.go = go;
window.setTab = function(t){ activeTab = t; render(); };
window.setStatus = setStatus; window.reviewDone = reviewDone; window.reviewRevisit = reviewRevisit;
window.toggleDayDone = function(id){ state.daysDone[id] = !state.daysDone[id]; save(); render(); };
window.guessPattern = function(key, inputId){
  const guess = document.getElementById(inputId).value.trim();
  const el = document.getElementById("pat-" + key);
  const p = DAYS.find(d => d.id === view.id).practice.find(p => p.s === key);
  if (!guess) { el.innerHTML = '<span style="color:var(--warn);font-size:12px">Commit to a guess first!</span>'; return; }
  el.innerHTML = '<span class="pattern-shown">Your guess: ' + esc(guess) + ' → Actual: 🎯 ' + p.pat + '</span>';
};

function renderHome() {
  const total = DAYS.reduce((a,d)=>a+d.practice.length,0);
  const counts = { independent:0, hints:0, solution:0, revision:0 };
  for (const k of Object.keys(state.problems)) { const st = state.problems[k].status; if (counts[st] !== undefined) counts[st]++; }
  const solved = counts.independent + counts.hints + counts.solution + counts.revision;
  const daysDone = Object.values(state.daysDone).filter(Boolean).length;
  const nextDay = DAYS.find(d => !state.daysDone[d.id]);
  if (!state.startDate) { state.startDate = todayStr(); save(); }
  const start = state.startDate;
  return `
  <div class="lesson">
    <h3>Welcome to your 28-day SDE-2 DSA preparation</h3>
    <p>This app implements your complete preparation system: concept-first lessons (the underlying problem → the technique → variations), guided examples with dry runs, one-at-a-time LeetCode practice with spaced-repetition tracking (1/3/7 days), pattern-recognition mixed practice, and timed mock interviews.</p>
    <div class="stat-grid">
      <div class="stat"><div class="v">${daysDone}/28</div><div class="l">Days completed</div><div class="pbar"><div style="width:${daysDone/28*100}%"></div></div></div>
      <div class="stat"><div class="v">${solved}/${total}</div><div class="l">Problems attempted</div><div class="pbar"><div style="width:${solved/total*100}%"></div></div></div>
      <div class="stat"><div class="v" style="color:var(--good)">${counts.independent}</div><div class="l">Solved independently</div></div>
      <div class="stat"><div class="v" style="color:var(--warn)">${counts.hints + counts.revision}</div><div class="l">With hints / revision</div></div>
      <div class="stat"><div class="v" style="color:var(--bad)">${counts.solution}</div><div class="l">Needed solution</div></div>
      <div class="stat"><div class="v" style="color:var(--warn)">${pendingReviews()}</div><div class="l">Reviews due today</div></div>
    </div>
    ${nextDay ? `<div class="callout"><b>Next up:</b> Day ${nextDay.id} — ${nextDay.title}.<br>
      <b>Daily structure:</b> 30–45 min concepts (Lesson + Guided tabs) → 60–90 min problem solving (Practice tab) → 15–30 min review (Review Queue). Use the timer at the top right for each segment.</div>`
      : `<div class="callout" style="border-left-color:var(--good)">🎉 <b>Roadmap complete!</b> Keep the rhythm: clear reviews daily, one mock every 2–3 days, one new medium problem daily.</div>`}
    <h3>How to use each day</h3>
    <ol>
      <li><b>Lesson</b> — read the concept derivation: brute force → wasted work → technique → invariant → when NOT to use it.</li>
      <li><b>Guided Example</b> — study the worked solution before attempting anything alone.</li>
      <li><b>Practice</b> — one problem at a time, in order. Attempt it on LeetCode, then record your honest status. Non-independent solves auto-enter the review queue.</li>
      <li><b>Check Understanding</b> — answer the conceptual questions OUT LOUD (or in your AI chat) before marking the day complete.</li>
    </ol>
    <div class="callout warn"><b>Pair this app with your AI instructor chat:</b> paste your solutions and conceptual answers into the chat conversation for SDE-2-level code review and Socratic feedback. This app tracks structure and spaced repetition; the chat provides the interactive coaching.</div>
    <p class="note">Started: ${start} · All progress stored locally in your browser (localStorage). Target: interview-ready by Dec 7, 2026, mocks through Dec 14.</p>
    <p style="margin-top:18px"><button class="btn" onclick="go('day',${nextDay?nextDay.id:1})">Continue to Day ${nextDay?nextDay.id:1} →</button></p>
  </div>`;
}

function renderReview() {
  const due = dueReviews();
  const t = todayStr();
  const scheduled = [];
  for (const key of Object.keys(state.problems)) {
    for (const r of (state.problems[key].reviews || [])) if (!r.done && r.due > t) scheduled.push({ p: state.problems[key], r });
  }
  scheduled.sort((a,b)=>a.r.due<b.r.due?-1:1);
  let html = '<div class="lesson"><h3>Due now (' + due.length + ')</h3>';
  if (!due.length) html += '<p>No reviews due today. 🎉 Clear your scheduled reviews when they arrive — consistency beats cramming.</p>';
  for (const item of due) {
    html += '<div class="review-item"><div><a href="' + item.p.url + '" target="_blank" style="color:var(--accent);font-weight:600;text-decoration:none">' + item.p.title + '</a>'
      + '<span class="diff ' + item.p.diff + '" style="margin-left:8px">' + (item.p.diff==="easy"?"Easy":item.p.diff==="med"?"Medium":"Hard") + '</span>'
      + '<div class="note" style="margin-top:4px">Day ' + item.p.day + ' · marked "' + STATUS_LABEL[item.p.status] + '" on ' + item.p.date + ' · re-solve from scratch</div></div>'
      + '<div><button class="btn small" style="background:var(--good)" onclick="reviewDone(\'' + item.key + '\')">Done ✓</button> '
      + '<button class="btn small ghost" onclick="reviewRevisit(\'' + item.key + '\')">Still hard ↺</button></div></div>';
  }
  html += '<h3 style="margin-top:28px">Upcoming (next 7 days)</h3>';
  if (!scheduled.length) html += '<p class="note">Nothing scheduled yet. Mark problems in Practice tabs to build your queue.</p>';
  for (const s of scheduled.slice(0, 12)) {
    html += '<div class="prob-card" style="padding:10px 16px"><span style="font-size:13.5px">' + s.p.title + '</span><span class="note" style="float:right">due ' + s.r.due + '</span></div>';
  }
  return html + "</div>";
}

function renderDay(d) {
  const tabs = [
    ["lesson","📖 Lesson"],["guided","🧑‍🏫 Guided Example"],
    ["practice","🎯 Practice" + (d.id===25?" (pattern hidden!)":"")],["checks","✅ Check Understanding"]
  ];
  let html = '<div class="tabs">' + tabs.map(t =>
    '<div class="tab ' + (activeTab===t[0]?"active":"") + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + '</div>').join("") + '</div>';

  if (activeTab === "lesson") {
    html += '<div class="lesson">' + d.lesson + '</div>';
  } else if (activeTab === "guided") {
    html += '<div class="lesson"><h3>' + d.guided.title + '</h3>'
      + '<div class="callout"><b>Intuition &amp; derivation:</b><br>' + d.guided.intuition + '</div>'
      + '<pre id="guided-code"></pre>'
      + '<div class="callout"><b>Complexity &amp; edge cases:</b><br>' + d.guided.complexity + '</div>'
      + '<p class="note">Study this until you could re-derive it on a whiteboard — then move to Practice and attempt problems cold.</p></div>';
  } else if (activeTab === "practice") {
    html += '<div class="lesson"><p><b>One problem at a time.</b> Attempt it on LeetCode before looking at anything else. For each problem: state your approach, the invariant, and the complexity — then implement. Record your honest status; anything not "independent" automatically enters the 1/3/7-day review cycle.</p>';
    if (d.id === 25) html += '<div class="callout warn"><b>Pattern-recognition mode:</b> commit a written pattern guess before revealing. Use the four identification questions from the Lesson tab.</div>';
    if (d.id === 27) html += '<div class="callout warn"><b>Mock mode:</b> 35 minutes per problem, strict. Follow the clarify → approach → code → test protocol from the Lesson tab.</div>';
    html += '</div>';
    d.practice.forEach((p, i) => {
      const st = state.problems[p.s] ? state.problems[p.s].status : null;
      const probJSON = JSON.stringify(p).replace(/"/g,'&quot;');
      html += '<div class="prob-card"><div class="prob-head"><div class="prob-title">'
        + (d.id===25 ? (i+1) + '. ' + p.t : (i+1) + '. <a href="' + LC(p.s) + '" target="_blank">' + p.t + ' ↗</a>')
        + (d.id===25 ? ' <a href="' + LC(p.s) + '" target="_blank" style="font-size:12px;margin-left:6px">open ↗</a>' : '')
        + ' <span class="diff ' + p.d + '">' + (p.d===E?"Easy":p.d===M?"Medium":"Hard") + '</span></div></div>';
      if (d.id===25) {
        html += '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
          + '<input class="guess" id="guess-' + p.s + '" placeholder="Your pattern guess…">'
          + '<button class="reveal-pat" onclick="guessPattern(\'' + p.s + '\',\'guess-' + p.s + '\')">Commit &amp; reveal pattern</button></div>'
          + '<div id="pat-' + p.s + '" style="margin-top:8px"></div>';
      }
      html += '<div class="status-btns">' + Object.keys(STATUS_LABEL).map(k =>
        '<button class="sbtn ' + (st===k?("sel-"+k):"") + '" onclick="setStatus(' + d.id + ',JSON.parse(\'' + probJSON.replace(/'/g,"\\'") + '\'),\'' + k + '\')">' + STATUS_LABEL[k] + '</button>').join("") + '</div></div>';
    });
  } else if (activeTab === "checks") {
    html += '<div class="lesson"><p><b>Before marking this day complete</b>, answer these out loud (or write them in your AI instructor chat for evaluation). Don\'t move on until you can answer each one cleanly — these test understanding, not recall.</p></div>';
    d.checks.forEach((q, i) => {
      html += '<div class="check-q"><span class="qn">Conceptual Check ' + (i+1) + '</span>' + q + '</div>';
    });
  }

  const done = !!state.daysDone[d.id];
  html += '<div class="day-complete"><div><b>' + (done ? "✅ Day "+d.id+" complete" : "Day "+d.id+" learning objectives") + '</b>'
    + '<div class="note">' + (done ? "Great work. Come back tomorrow — or review earlier days anytime." : "Lesson read · guided example studied · practice attempted · conceptual checks answered") + '</div></div>'
    + '<button class="btn ' + (done?"ghost":"") + '" onclick="toggleDayDone(' + d.id + ')">' + (done?"Mark incomplete":"Mark Day "+d.id+" Complete") + '</button></div>';
  if (done && d.id < 28) html += '<p style="margin-top:14px"><button class="btn" onclick="go(\'day\',' + (d.id+1) + ')">Go to Day ' + (d.id+1) + ' →</button></p>';
  return html;
}

render();
</script>
